# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-walky"
BBFILE_PATTERN_meta-walky = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-walky = "10"

LAYERDEPENDS_meta-walky = "core"
LAYERSERIES_COMPAT_meta-walky = "scarthgap"
